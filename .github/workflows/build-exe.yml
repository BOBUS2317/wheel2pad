name: Build wheel2pad.exe

# Результат — один файл wheel2pad.exe, как у x360ce:
#   • ручной запуск (кнопка "Run workflow") → артефакт Wheel2Pad
#     (GitHub всегда отдаёт артефакты zip-архивом, внутри — только exe);
#   • тег вида v1.0 → релиз на странице Releases с exe без архива.
on:
  workflow_dispatch:        # кнопка "Run workflow" во вкладке Actions
  push:
    tags: ["v*"]            # или пушнуть тег, например v1.0

permissions:
  contents: write           # нужно, чтобы создать релиз и приложить к нему exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"   # не запускать установщик драйвера на CI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Путь к иконке абсолютный: с --specpath относительные пути PyInstaller ищет от папки build.
      # --add-data: иконка ещё и для окна кнопок (wheel2pad_gui.py), а не только для самого exe.
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name wheel2pad --icon "${{ github.workspace }}\assets\wheel2pad.ico"
          --add-data "${{ github.workspace }}\assets\wheel2pad.ico;assets"
          --collect-all vgamepad --exclude-module vgamepad.lin
          --distpath build/dist --workpath build/work --specpath build wheel2pad.py

      # Установщик ViGEmBus должен оказаться внутри exe — иначе программа не сможет
      # предложить поставить драйвер. Проверяем по содержимому собранного архива.
      - name: Check that ViGEmBus installer is bundled
        shell: pwsh
        run: |
          $toc = pyi-archive_viewer --list build/dist/wheel2pad.exe
          if (-not ($toc | Select-String 'ViGEmBusSetup_x64.msi')) { throw 'ViGEmBusSetup_x64.msi не попал в exe' }
          Write-Host 'ViGEmBusSetup_x64.msi найден внутри exe'
          # Окно кнопок: сам модуль (лежит в PYZ — нужен --recursive) и Tcl/Tk для tkinter.
          $all = pyi-archive_viewer --list --recursive build/dist/wheel2pad.exe
          if (-not ($all | Select-String 'wheel2pad_gui')) { throw 'wheel2pad_gui не попал в exe' }
          if (-not ($toc | Select-String 'tk86t.dll')) { throw 'Tcl/Tk не попали в exe — окно кнопок не откроется' }
          Write-Host 'Окно кнопок (wheel2pad_gui + Tcl/Tk) внутри exe'

      - uses: actions/upload-artifact@v4
        with:
          name: Wheel2Pad
          path: build/dist/wheel2pad.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/wheel2pad.exe
          generate_release_notes: true
